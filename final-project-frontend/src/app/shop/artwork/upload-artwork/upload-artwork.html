<!-- <p>upload-artwork works!</p> -->
<div class="upload-artwork-container">
  <mat-card class="edit-shop-card" appearance="outlined">
    <mat-card-header class="edit-shop-header">
      <mat-card-title class="edit-shop-title">Upload Artwork</mat-card-title>
    </mat-card-header>
  
  <mat-card-content>
    <form [formGroup]="artworkForm" (ngSubmit)="onSubmit()" class="upload-artwork-form">
      <div>
        <mat-form-field class="title-input">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" name="title" placeholder="" required />
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="description-input">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" name="description"></textarea>
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="type-input">
          <mat-label>Artwork Type</mat-label>
            <mat-select formControlName="type">
              <mat-option value="PHYSICAL">Physical (traditional)</mat-option>
              <mat-option value="DIGITAL">Digital</mat-option>
            </mat-select>
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="price-input">
          <mat-label>Price</mat-label>
          <input matInput type="number" formControlName="price" name="price" min="0"/>
        </mat-form-field>
      </div>
      <div>
        <p>
        <!-- <mat-form-field class="tag-input">
          <mat-label>Tags (comma separated)</mat-label>
          <input matInput type="text" formControlName="tags" name="tags" placeholder="" />
        </mat-form-field> -->
        <mat-form-field class="full-width">
          <mat-label>Tags</mat-label>
          <mat-chip-grid #chipGrid aria-label="Enter artwork tags">
            
            @for (tag of tagsControl.value; track tag) {
              <mat-chip-row (removed)="removeTag(tag)">
                {{tag}}
                <button matChipRemove aria-label="'remove ' + tag">
                  <mat-icon>cancel</mat-icon>
                </button>
              </mat-chip-row>
            }

            <input placeholder="New tag..."
                  [matChipInputFor]="chipGrid"
                  [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                  [matChipInputAddOnBlur]="true"
                  (matChipInputTokenEnd)="addTag($event)"/>
          </mat-chip-grid>
          <mat-hint>Press Enter or comma to add a tag</mat-hint>
        </mat-form-field>
        </p>
      </div>
      @if (shop?.aiTags) {
        <div class="suggest-tags">
          <button type="button" class="suggest-tags-button" matButton (click)="suggestTags()">Suggest AI tags</button>
        </div>
        
      }
      
      <div class="choose-file">
        <button type="button" class="choose-file-button" matButton (click)="fileInput.click()">Choose File</button>
        <input hidden (change)="onFileSelected($event)" #fileInput type="file" accept="image/*" required>
        <span class="file-name">{{selectedFile?.name}}</span>
        <!-- <input type="file" (change)="onFileSelected($event)" accept="image/*" required /> -->
      </div>
      <div>
        <button class="upload-artwork-button" matButton="tonal" type="submit" [disabled]="artworkForm.invalid">Upload</button>
      </div>
    </form>
  </mat-card-content> 
  </mat-card>
    
</div>
