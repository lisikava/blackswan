@if(shop$ | async; as shop) {
    <div class="edit-shop-container">
        <mat-card class="edit-shop-card" appearance="outlined">
            <mat-card-header class="edit-shop-header">
                <mat-card-title class="edit-shop-title">Edit Your Shop</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <form [formGroup]="shopForm" (ngSubmit)="onSubmit()" class="edit-shop-form">
                    <div>
                        <mat-form-field class="shop-name-input">
                            <input matInput type="text" formControlName="name" placeholder="Shop Name">
                        </mat-form-field>
                    </div>
                    <div>
                        <mat-form-field class="shop-description-input">
                            <textarea matInput formControlName="description" placeholder="Shop Description" value="{{shop.description}}"></textarea>
                        </mat-form-field>
                    </div>

                    <button matButton="tonal" type="submit" [disabled]="shopForm.invalid || isSubmitting">
                    Save
                    </button>
                    <button matButton="tonal" type="button" (click)="cancel()">Cancel</button>
                    @if (error$ | async; as error) {
                        <div>{{ error }}</div>
                    }
                </form>
            </mat-card-content>
        </mat-card>
        <!-- <h2></h2> -->

            

        </div>
}
