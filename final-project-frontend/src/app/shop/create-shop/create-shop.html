<div class="create-shop-container">
    <mat-card class="edit-shop-card" appearance="outlined">
        <mat-card-header class="edit-shop-header">
            <mat-card-title class="edit-shop-title">Create A Shop</mat-card-title>
        </mat-card-header>
    
    <mat-card-content>
        <form [formGroup]="shopForm" (ngSubmit)="onSubmit()" class="create-shop-form">
            <div>
                <mat-form-field class="shop-name-input">
                    <input matInput type="text" formControlName="name" placeholder="Shop Name">
                </mat-form-field>
            </div>
            <div>
                <mat-form-field class="shop-description-input">
                    <textarea matInput formControlName="description" placeholder="Shop Description"></textarea>
                </mat-form-field>
            </div>
            <div>
                <mat-checkbox formControlName="aiTags" class="ai-tags-input">I agree to let AI analyze my works and suggest descriptive tags</mat-checkbox>
            </div>

            <button matButton="tonal" type="submit" [disabled]="shopForm.invalid || isSubmitting">
                {{ isSubmitting ? 'Creating...' : 'Create Shop' }}
            </button>
            @if (error$ | async; as error) {
                <div>{{ error }}</div>
            }
        </form>
    </mat-card-content>
    </mat-card>
<!-- <h2></h2> -->

</div>
