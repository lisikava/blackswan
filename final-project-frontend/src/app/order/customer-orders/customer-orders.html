<div class="orders-container">
    <header class="dashboard-header">
         <h1>Your Orders</h1>
         <p>Check the artworks you've ordered!</p>
    </header>
    <mat-card class="grid-item manage-section">
        <mat-card-header>
        <!-- <mat-card-title>Your orders</mat-card-title> -->
        </mat-card-header>
        <mat-card-content>
        <div class="artwork-grid">
            @if (orders$ | async; as orders) {
                @for (order of orders; track order.id) {
                    <div class="artwork-item">
                    <mat-card class="art-card" appearance="outlined">
                        <mat-card-header>
                            <mat-card-title>Order #{{order.id}} from {{order.shopName}}</mat-card-title>
                        </mat-card-header>
                        <div class="image-wrapper">
                            <img mat-card-image [src]="'http://localhost:8080' + order.imageUrl">
                        </div>
                        <mat-card-content>
                            <p class="description-text">Order Status: {{order.status}}</p>
                        </mat-card-content>
                        <mat-card-actions>
                            <a matButton (click)="confirmReceived()">Confirm received</a>
                        </mat-card-actions>
                        
                    </mat-card>
                    </div>
                } @empty {
                    <p>No orders yet.</p>
                }
            }
        </div>
        </mat-card-content>
        </mat-card>
</div>
